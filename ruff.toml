# One lint config for every Python package in the repo (backend, worker,
# mcp-server, scripts, seed, ml). Run via `make lint`; CI runs the same.
target-version = "py313"
extend-exclude = ["frontend"]

[lint]
# pycodestyle errors + pyflakes: undefined names, unused imports, syntax errors.
select = ["E4", "E7", "E9", "F"]
